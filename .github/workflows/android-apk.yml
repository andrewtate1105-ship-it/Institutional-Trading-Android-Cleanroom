name: Build verified Android APK

on:
  push:
    branches: [main, agent/once-only-onboarding]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper when missing
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
          grep -q 'gradle-8.9-' gradle/wrapper/gradle-wrapper.properties

      - name: Verify source contains no configured secrets or removed messaging surface
        run: |
          set -euo pipefail
          ! find . -type f \( -name '.env' -o -name 'profile.json' -o -name 'resources.json' -o -name 'alert-state.json' -o -name '*.jks' -o -name '*.keystore' \) -print -quit | grep -q .
          ! grep -RIE --exclude-dir=.git --exclude='*.md' --exclude='*.txt' '[0-9]{6,12}:[A-Za-z0-9_-]{20,}' .
          ! grep -RIE --exclude-dir=.git 'placeOrder|executeOrder|brokerLogin|growwPassword' app/src
          ! grep -RIE --exclude-dir=.git 'telegram|api\.telegram\.org|botfather|sendMessage|chat_id' app/src
          ! grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml

      - name: Prepare optional release signing
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_RELEASE_KEYSTORE_B64:-}" ] && \
             [ -n "${ANDROID_RELEASE_STORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_RELEASE_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_RELEASE_KEY_PASSWORD:-}" ]; then
            store="$RUNNER_TEMP/institutional-trading-release.jks"
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$store"
            test -s "$store"
            echo "ANDROID_RELEASE_STORE_FILE=$store" >> "$GITHUB_ENV"
            echo "APK_BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "APK_BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Verify release build path
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Build fallback debug APK when release signing is unavailable
        if: env.RELEASE_SIGNING_READY != 'true'
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and package APK
        run: |
          set -euo pipefail
          if [ "$APK_BUILD_TYPE" = "release" ]; then
            src=$(find app/build/outputs/apk/release -name '*.apk' -type f ! -name '*unsigned*' -print -quit)
          else
            src=$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          fi
          test -n "$src"
          test -s "$src"
          mkdir -p dist
          cp "$src" dist/Institutional-Trading-System-Android.apk
          cp INSTALL_ANDROID.txt dist/INSTALL_ANDROID.txt
          printf 'build_type=%s\nrelease_signing=%s\nrelease_path_verified=true\n' "$APK_BUILD_TYPE" "$RELEASE_SIGNING_READY" > dist/BUILD_INFO.txt

          unzip -l dist/Institutional-Trading-System-Android.apk > /tmp/apk-list.txt
          grep -q 'classes.dex' /tmp/apk-list.txt
          ! grep -Ei '(^|/)(profile\.json|resources\.json|alert-state\.json|\.env)$' /tmp/apk-list.txt

          unzip -p dist/Institutional-Trading-System-Android.apk classes.dex > /tmp/classes.dex
          ! strings /tmp/classes.dex | grep -Eq '[0-9]{6,12}:[A-Za-z0-9_-]{20,}'
          ! strings /tmp/classes.dex | grep -Eiq 'telegram|api\.telegram\.org|botfather|sendMessage|chat_id'

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Institutional-Trading-System-Android.apk > /tmp/apksigner.txt
          grep -q 'Verifies' /tmp/apksigner.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Institutional-Trading-System-Android.apk > /tmp/badging.txt
          grep -q "package: name='com.institutionaltrading.mobile'" /tmp/badging.txt
          grep -q "versionCode='2'" /tmp/badging.txt
          grep -q "versionName='0.2.0-cleanroom'" /tmp/badging.txt
          grep -q "sdkVersion:'24'" /tmp/badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/badging.txt

          sha256sum dist/Institutional-Trading-System-Android.apk > dist/Institutional-Trading-System-Android.apk.sha256
          expected=$(cut -d ' ' -f1 dist/Institutional-Trading-System-Android.apk.sha256)
          actual=$(sha256sum dist/Institutional-Trading-System-Android.apk | cut -d ' ' -f1)
          test "$expected" = "$actual"

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Institutional-Trading-System-Android-${{ github.sha }}
          path: |
            dist/Institutional-Trading-System-Android.apk
            dist/Institutional-Trading-System-Android.apk.sha256
            dist/INSTALL_ANDROID.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
